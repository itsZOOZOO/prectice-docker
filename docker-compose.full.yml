# Optional: full stack with Nuxt web on the VPS (not used when UI is on Vercel).
# Prefer docker-compose.prod.yml for normal deploys.
#
#   docker compose -f docker-compose.full.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prectice}
      POSTGRES_USER: ${POSTGRES_USER:-prectice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prectice} -d ${POSTGRES_DB:-prectice}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prectice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prectice}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${CADDY_DOMAIN}}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      APP_NAME: Prectice
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-quantum-dental-patients-files}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_URL_TTL: ${S3_URL_TTL:-3600}
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --proxy-headers
      --forwarded-allow-ips=*
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        NUXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN}
      CADDY_API_DOMAIN: ${CADDY_API_DOMAIN:-api.${CADDY_DOMAIN}}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile.full:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
